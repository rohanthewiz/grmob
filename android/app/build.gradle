plugins {
    id 'com.android.application'
    // No 'kotlin-android' here: AGP 9 has built-in Kotlin support and fails the
    // build if the standalone plugin is also applied. See kotl.in/gradle/agp-built-in-kotlin.
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    // Properties are assigned with '=' throughout. The Groovy space-assignment
    // form ('namespace "x"') is deprecated and removed in Gradle 10.
    namespace = 'com.grmob.app'
    compileSdk = 34

    defaultConfig {
        applicationId = "com.grmob.app"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "0.1"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
    }
}

// Replaces the old android.kotlinOptions block, which Kotlin 2.x deprecated in
// favour of the typed compilerOptions DSL on the kotlin extension.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // The Go core + app, bound by gomobile. Produced by ../build.sh.
    implementation files('libs/grmob.aar')

    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom

    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.foundation:foundation'
    // material3 supplies the interaction-heavy widgets (Button ripple,
    // Checkbox, TabRow) with correct accessibility semantics; GrMob styles
    // are injected through their color/shape/padding slots.
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'

    // Image node rendering (remote/local sources).
    implementation 'io.coil-kt:coil-compose:2.6.0'
}
