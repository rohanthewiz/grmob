buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 9.x is required to build on Gradle 9.6+. Every AGP 8.x release
        // reaches for org.gradle.api.problems.internal.InternalProblems, which
        // Gradle removed in 9.6.0, so the 8 line caps out at Gradle 9.5 --
        // there is no incremental hop, the major bump is the only way forward.
        classpath 'com.android.tools.build:gradle:9.4.0'
        // AGP 9 supplies Kotlin compilation itself; the kotlin-android plugin
        // is deliberately absent from the app module for that reason. The
        // Kotlin plugin stays on the classpath because the Compose plugin
        // below is versioned against it.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10'
        // Kotlin 2.x moved the Compose compiler out of a separately-versioned
        // artifact and into a first-party plugin locked to the Kotlin version.
        // This replaces the app module's old composeOptions block, so there is
        // no longer a compose-compiler <-> Kotlin pairing to keep in sync.
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.10'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
