site_name: GrMob
site_description: Native mobile apps in pure Go — declarative views, hook-based state, diff-patched rendering on Android, iOS, and the web.
repo_url: https://github.com/rohanthewiz/grmob
repo_name: rohanthewiz/grmob

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorial — Interactive: tutorial-interactive.md
  - Tutorial — Todo App: tutorial-todo.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Views & Composition: concepts/views.md
      - State & Hooks: concepts/state-and-hooks.md
      - Events & Callbacks: concepts/events.md
      - Forms & Validation: concepts/forms.md
      - Navigation: concepts/navigation.md
      - Styling & Theming: concepts/styling-and-theming.md
      - Reconciliation: concepts/reconciliation.md
      - Caching: concepts/caching.md
      - Error Boundaries: concepts/error-boundaries.md
      - Debug Mode: concepts/debug-mode.md
  - Widget Library: components.md
  - Platforms:
      - Native Android & iOS: platforms/native.md
      - WebAssembly: platforms/wasm.md
      - Exporters: platforms/exporters.md
  # docs/api is generated: `go run ./internal/apidoc/gen`. The nav below is
  # hand-kept so that the order is editorial rather than alphabetical, and
  # internal/apidoc's TestNavListsEveryPage fails if a generated page is
  # missing from it.
  - API Reference:
      - Overview: api/index.md
      - core: api/core.md
      - hooks: api/hooks.md
      - render: api/render.md
      - reconcile: api/reconcile.md
      - comps: api/comps.md
      - forms: api/forms.md
      - richtext: api/richtext.md
      - highlight: api/highlight.md
      - htmlout: api/htmlout.md
      - jsonout: api/jsonout.md
      - mobile: api/mobile.md
      - permission: api/permission.md
