# xcodegen spec — generates GrMobApp.xcodeproj (which stays untracked; this
# file is the source of truth). Regenerate after changing it:
#   brew install xcodegen   # once
#   cd ios && xcodegen generate
name: GrMobApp
options:
  bundleIdPrefix: com.grmob
  deploymentTarget:
    iOS: "17.0" # floor set by the runtime's use of @Observable + containerRelativeFrame
settings:
  SWIFT_VERSION: "5.9"
targets:
  GrMobApp:
    type: application
    platform: iOS
    sources:
      - GrMob
    dependencies:
      # gomobile emits a static xcframework, so it links in; nothing to embed.
      - framework: Frameworks/GrMob.xcframework
        embed: false
    info:
      path: GrMob/Info.plist
      properties:
        UILaunchScreen: {} # system default launch screen; without it iOS letterboxes the app
        # core's audio service: without the audio background mode the
        # stream stops the moment the app leaves the foreground, whatever
        # the audio session category says. See App/AudioPlayer.swift.
        UIBackgroundModes: [audio]
        # Development only: lets the simulator talk to a server on the Mac
        # over plain http (the church app's API_BASE=http://localhost:8088
        # build, and AVPlayer streaming its /sermon-audio URLs). ATS still
        # requires TLS for every non-local host.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Go's permission package (App/Permissions.swift). These are not
        # optional documentation: iOS *crashes* the app when a prompt would
        # appear and its usage-description key is absent, so a shell that
        # ships permission.Request without them fails at the one moment it is
        # being exercised. One key per Permission constant.
        NSCameraUsageDescription: Demonstrates permission.Camera. Nothing is captured or stored.
        NSMicrophoneUsageDescription: Demonstrates permission.Microphone. Nothing is recorded or stored.
        NSLocationWhenInUseUsageDescription: Demonstrates permission.Location, and lets the compass report true north instead of magnetic north.
        NSPhotoLibraryUsageDescription: Demonstrates permission.Storage. Nothing is read or written.
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.grmob.demo
      # gomobile's generated glue is Objective-C; the app is Swift-only, but
      # linking Go's runtime archive wants the ObjC linker flag.
      OTHER_LDFLAGS: -ObjC
  # Simulator smoke test: drives the demo app through all four event kinds
  # plus the push channel (see GrMobUITests.swift). Run with:
  #   xcodebuild test -project GrMobApp.xcodeproj -scheme GrMobApp \
  #     -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
  GrMobUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GrMobUITests
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GrMobApp
schemes:
  GrMobApp:
    build:
      targets:
        GrMobApp: all
        GrMobUITests: [test]
    test:
      targets:
        - GrMobUITests
