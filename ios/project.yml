# xcodegen spec — generates GrMobApp.xcodeproj (which stays untracked; this
# file is the source of truth). Regenerate after changing it:
#   brew install xcodegen   # once
#   cd ios && xcodegen generate
name: GrMobApp
options:
  bundleIdPrefix: com.grmob
  deploymentTarget:
    iOS: "17.0" # floor set by the runtime's use of @Observable + containerRelativeFrame
settings:
  SWIFT_VERSION: "5.9"
targets:
  GrMobApp:
    type: application
    platform: iOS
    sources:
      - GrMob
    dependencies:
      # gomobile emits a static xcframework, so it links in; nothing to embed.
      - framework: Frameworks/GrMob.xcframework
        embed: false
    info:
      path: GrMob/Info.plist
      properties:
        UILaunchScreen: {} # system default launch screen; without it iOS letterboxes the app
        # core's audio service: without the audio background mode the
        # stream stops the moment the app leaves the foreground, whatever
        # the audio session category says. See App/AudioPlayer.swift.
        UIBackgroundModes: [audio]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.grmob.demo
      # gomobile's generated glue is Objective-C; the app is Swift-only, but
      # linking Go's runtime archive wants the ObjC linker flag.
      OTHER_LDFLAGS: -ObjC
  # Simulator smoke test: drives the demo app through all four event kinds
  # plus the push channel (see GrMobUITests.swift). Run with:
  #   xcodebuild test -project GrMobApp.xcodeproj -scheme GrMobApp \
  #     -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
  GrMobUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GrMobUITests
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GrMobApp
schemes:
  GrMobApp:
    build:
      targets:
        GrMobApp: all
        GrMobUITests: [test]
    test:
      targets:
        - GrMobUITests
