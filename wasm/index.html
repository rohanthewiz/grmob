<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrMob · Interactive Tutorial</title>
<meta name="description" content="Learn GrMob — native mobile apps in pure Go — by tapping it: 51 live lessons running in your browser via WebAssembly.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232b6cb0'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='bold' text-anchor='middle' fill='%23ffffff'%3Egm%3C/text%3E%3C/svg%3E">
<style>
  /* The page is a frame around the app, not part of it: the app paints its
     own surface (core.DefaultTheme) inside #app, so everything here is the
     chrome a visitor sees around a phone-sized screen — header, the bezel,
     the loading state. Same token names and palette as go-learn so the two
     sites read as siblings. */
  :root {
    --bg: #14161a; --panel: #1c1f26; --edge: #2c313c;
    --fg: #d8dde6; --dim: #8b93a3; --accent: #63b3ed;
    --err-bg: #3b1f24; --err-edge: #a33c4b; --err-fg: #ffb4bd;
    --ok: #7ec699; --bezel: #0b0c0f;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8; --panel: #ffffff; --edge: #d7dbe2;
      --fg: #22262e; --dim: #667085; --accent: #2b6cb0;
      --err-bg: #fdeef0; --err-edge: #d3546a; --err-fg: #9b1c32;
      --ok: #2f855a; --bezel: #1c1f26;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 system-ui, sans-serif;
    display: flex; flex-direction: column;
  }

  /* --- header --------------------------------------------------------------- */
  header {
    flex: none; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: .55rem .9rem; border-bottom: 1px solid var(--edge);
    background: var(--panel);
  }
  header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
  header h1 span { color: var(--accent); }
  header .meta { color: var(--dim); font-size: .8rem; }
  header .spacer { flex: 1; }
  header a { color: var(--accent); text-decoration: none; font-size: .85rem; }
  header a:hover { text-decoration: underline; }
  header .copylink {
    font: inherit; font-size: .8rem; cursor: pointer; color: var(--accent);
    background: var(--bg); border: 1px solid var(--edge); border-radius: 6px; padding: .2rem .6rem;
  }
  header .copylink:hover { border-color: var(--accent); }
  header .copylink.done { color: var(--ok); border-color: var(--ok); }

  /* The layout switch: two buttons in one pill, the pressed one filled.
     aria-pressed is both the state a screen reader hears and the hook the
     look is keyed on, so the two cannot disagree. */
  header .layout-toggle {
    display: inline-flex; border: 1px solid var(--edge); border-radius: 6px; overflow: hidden;
  }
  header .layout-toggle[hidden] { display: none; }
  header .layout-toggle button {
    font: inherit; font-size: .8rem; cursor: pointer; color: var(--dim);
    background: var(--bg); border: 0; padding: .2rem .6rem;
  }
  header .layout-toggle button + button { border-left: 1px solid var(--edge); }
  header .layout-toggle button:hover { color: var(--fg); }
  header .layout-toggle button[aria-pressed="true"] { color: var(--panel); background: var(--accent); }

  /* --- stage: the app centred in a phone bezel ------------------------------
     A phone-width, phone-height viewport is what the tutorial was designed
     for, and what the natives give it; showing it in a bezel on a wide
     screen keeps the lessons' layouts honest (a Row that fits 400px, not
     1400px). Under 520px the bezel goes away and the app takes the whole
     viewport — on an actual phone, that *is* the phone. */
  main {
    flex: 1; min-height: 0; display: flex;
    align-items: center; justify-content: center; padding: 1.2rem;
  }
  .phone {
    position: relative; display: flex; flex-direction: column;
    width: 100%; max-width: 430px; height: 100%; max-height: 900px;
    background: var(--bezel); border-radius: 34px; padding: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35), 0 0 0 1px var(--edge);
  }
  .screen {
    flex: 1; min-height: 0; position: relative;
    background: #ffffff; border-radius: 24px; overflow: hidden;
    /* The app's surface, so it states the app's ink as well as its paper.
       body sets `color: var(--fg)`, which in the dark palette is a near-white
       — and a core.Text that names no color of its own inherits whatever the
       host page says, because Style.TextColor is only emitted when set. On
       this hard-coded white screen that rendered those few uncoloured labels
       at about 1.3:1 against their background: invisible, for a reader whose
       OS is in dark mode and nobody else. Pinning the ink here matches
       core.DefaultTheme's TextPrimary and makes the phone independent of the
       page's palette, which is what a device screen actually is. */
    color: #000000;
    /* Makes the screen the containing block for `position: fixed`
       descendants, which is what core.Modal's overlay chassis is. Without it
       a modal escaped the bezel and dimmed the whole site — header, page
       margins and all — instead of the app it belongs to. A transform is the
       standard way to ask for this; `overflow: hidden` above then clips the
       overlay to the phone's rounded corners. */
    transform: translateZ(0);
  }
  @media (max-width: 520px) {
    main { padding: 0; }
    .phone { max-width: none; max-height: none; border-radius: 0; padding: 0; box-shadow: none; }
    .screen { border-radius: 0; }
  }

  /* #app is the mount point grmob-runtime.js fills (GrMob.mount). The root
     view must fill the screen for FlexGrow slack (the lesson scaffold's
     bottom-pinned tag) to have anything to grow into, so the root child is
     stretched to the screen's height and told it may shrink below its
     content — the app's own Scroll then does the scrolling, as on device. */
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; }
  #app > * { flex: 1; min-height: 0; }
  /* The runtime gives Scroll its flex chassis but no overflow: on the bare
     page it used to ship on, the *document* scrolled, so a Scroll never
     needed to. Inside a fixed-height screen it does — this is the one rule
     that turns the node into the viewport the natives make of it (Scroll
     grows to the space its parent leaves and scrolls its content), and it
     lives here rather than in grmob-runtime.js because it is a property of
     the host page's box, not of the node. */
  #app [data-node-type="Scroll"] {
    flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  }
  /* A core.List is a scrolling container on both natives (LazyColumn,
     SwiftUI's List), and the runtime gives it no overflow either — so a screen
     whose whole page is a List (the tutorial's contents, since it became one)
     grew to its content's 2,200px inside a 709px screen, the screen's
     `overflow: hidden` clipped it, and nothing below the fold could be scrolled
     to or tapped. Same viewport rule as Scroll.

     Except inside a Scroll. There the column has no definite height, so a
     zero basis would collapse the list to nothing (the horizontal-Scroll bug
     below, on the other axis), and a list nested in a scrolled page is meant
     to be as tall as its rows — lesson 4's outline demo is one. The :not()
     keeps that case on the runtime's own `flex: 1 1 auto`. */
  #app [data-node-type="List"]:not([data-node-type="Scroll"] [data-node-type="List"]) {
    flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  }
  /* A Scroll with core.Horizontal pans sideways, and the viewport rule above
     is wrong for it inside a column: flex 1 1 0 there is a zero-height basis,
     so a scrollable ChipStrip measured 0px tall with its chips spilling out.
     Here it is as tall as its content and keeps that height, which is what
     both natives' horizontal scroll composites do. Inside a row the rule
     above already meant "take the row's width", so that case is restated
     rather than changed. The runtime marks the axis only in the inline style
     (aria-orientation is written for composite roles alone), so the style
     attribute is the hook. */
  #app [data-node-type="Scroll"][style*="flex-direction: row"] {
    flex: 0 0 auto;
  }
  #app [style*="flex-direction: row"] > [data-node-type="Scroll"][style*="flex-direction: row"] {
    flex: 1 1 0; min-width: 0;
  }

  /* --- the two-pane layout ------------------------------------------------------
     The default on a wide screen: the lesson's guide (prose, code, key points)
     on a reading pane, its live demos on a phone beside it. The app builds the
     panes (examples/tutorial/split.go) when this page sends it the "layout"
     host event, and names them with ids; everything about how they look is
     here, because it is this page's chrome and palette, not the app's.

         main ─────────────────────────────────────────────────────────────┐
         │ #tutorial-split (row)                                            │
         │ ┌ #tutorial-guide ──────────────────────┐ ┌ #tutorial-phone ───┐ │
         │ │ the lesson, demos lifted out;         │ │ ┌ …-phone-screen ┐ │ │
         │ │ its text column capped and centred    │ │ │ header         │ │ │
         │ │                                       │ │ │ …-phone-content│ │ │
         │ └───────────────────────────────────────┘ │ └────────────────┘ │ │
         │                                           └────────────────────┘ │
         └──────────────────────────────────────────────────────────────────┘

     The bezel around #app below is switched off by :has() rather than by a
     class this page sets, so the chrome follows the tree the app actually
     drew. Between the page asking for the split and the app's patch arriving,
     the tree is still the phone layout, and so is the chrome around it — there
     is no frame with one and not the other. */
  main:has(#tutorial-split) { padding: 0; }
  main:has(#tutorial-split) .phone {
    max-width: none; max-height: none; padding: 0;
    background: none; border-radius: 0; box-shadow: none;
  }
  main:has(#tutorial-split) .screen { background: transparent; border-radius: 0; }

  #tutorial-split { gap: 1.2rem; padding: 1.2rem; align-items: stretch; }

  /* The guide takes whatever the phone leaves. It is not capped itself — the
     phone stays pinned to the right edge, which is what lets the toast rule
     below find it — so its text column is capped instead, centred in the pane
     at a line length that reads comfortably. The column is the Scroll's (a
     lesson) or the List's (the contents) direct children. */
  #tutorial-guide {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
    background: #ffffff; color: #000000; border-radius: 14px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.18), 0 0 0 1px var(--edge);
  }
  #tutorial-guide > * { flex: 1; min-height: 0; }
  /* The bar under a lesson that a demo's pushed screen covers (split.go,
     pushedScreenBar): its natural height, under the lesson, which keeps the
     rest. After the lesson in the tree, not before it, so the lesson keeps its
     slot and its scroll position while it is covered. */
  #tutorial-guide > #tutorial-guide-note { flex: none; padding: .6rem .8rem .8rem; }
  #tutorial-guide [data-node-type="Scroll"] > *,
  #tutorial-guide [data-node-type="List"] > * {
    width: 100%; max-width: 820px; margin-inline: auto;
  }

  /* The phone: the same bezel as the phone layout's .phone, at a fixed width,
     as tall as the pane allows up to a phone's height and centred vertically
     when that is less than the window. A height and align-self: center rather
     than stretch plus auto margins: an auto cross-axis margin turns stretch
     off, and the phone shrank to the height of its header. */
  #tutorial-phone {
    flex: none; width: 400px; height: 100%; max-height: 860px;
    align-self: center; display: flex; flex-direction: column;
    background: var(--bezel); border-radius: 34px; padding: 12px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35), 0 0 0 1px var(--edge);
  }
  /* The glass. The transform makes it the containing block for position:
     fixed descendants — core.Modal's overlay — for the reason .screen has one:
     a dialog from a demo dims the phone, not the guide beside it. */
  #tutorial-phone-screen {
    flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column;
    background: #ffffff; color: #000000; border-radius: 24px; overflow: hidden;
    transform: translateZ(0);
  }
  #tutorial-phone-screen > * { flex: none; }
  #tutorial-phone-content { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
  #tutorial-phone-content > * { flex: 1; min-height: 0; }

  /* Toasts. The runtime hangs its toast layer on #app's parent (.screen), with
     left/right 0 inline, so in the split it would centre toasts under the
     whole window. It is the one element of .screen that is not #app; this
     pins it over the phone instead — 1.2rem of split padding plus 12px of
     bezel from the right, the glass's width wide. !important because the
     layer's placement is inline style.

     The bottom follows the phone's own bottom, which is one of two lengths:
     the split's 1.2rem padding while the phone fills the split's height, or,
     once the phone is capped at 860px and centred, half of what is left over,
     (100% − 860px) / 2 of .screen's height (the padding cancels out of that
     one). Then 12px of bezel and the runtime's own 24px above the glass. The
     first version used the padding alone, and in a window taller than about
     900px the toast landed below the phone, 114px under the glass in a
     1300px-tall one. */
  main:has(#tutorial-split) .screen > :not(#app) {
    left: auto !important; right: calc(1.2rem + 12px) !important;
    bottom: calc(max(1.2rem, (100% - 860px) / 2) + 36px) !important; width: 376px;
  }

  /* --- loading / error state ---------------------------------------------------
     main.wasm is a few MB; the first paint is this, then the app replaces it
     (mount clears #app's innerHTML). */
  .boot {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: .8rem;
    color: #667085; background: #ffffff; font-size: .9rem; padding: 1.5rem; text-align: center;
  }
  .boot .spin {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid #d7dbe2; border-top-color: #2b6cb0;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .boot.err {
    color: var(--err-fg); background: var(--err-bg);
    border: 1px solid var(--err-edge); border-radius: 24px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .8rem;
    white-space: pre-wrap; align-items: flex-start; text-align: left; justify-content: flex-start;
  }
</style>
</head>
<body>

<header>
  <h1><span>GrMob</span> · Interactive Tutorial</h1>
  <span class="meta">75 lessons · 8 chapters · every demo is live Go, running in your browser</span>
  <span class="spacer"></span>
  <div id="layout-toggle" class="layout-toggle" role="group" aria-label="Layout" hidden>
    <button type="button" data-mode="split" aria-pressed="false" title="Read the guide beside a live phone">Guide + phone</button>
    <button type="button" data-mode="phone" aria-pressed="false" title="The tutorial as it runs on a phone">Phone only</button>
  </div>
  <button id="copylink" class="copylink" type="button" title="Copy a link to this lesson" hidden>🔗 Copy link</button>
  <a href="https://github.com/rohanthewiz/grmob/tree/master/docs" target="_blank" rel="noopener">Docs</a>
  <a href="https://github.com/rohanthewiz/grmob/tree/master/examples/tutorial" target="_blank" rel="noopener">Source</a>
  <a href="https://github.com/rohanthewiz/grmob" target="_blank" rel="noopener">GitHub</a>
</header>

<main>
  <div class="phone">
    <div class="screen">
      <div id="app">
        <div class="boot" id="boot">
          <div class="spin"></div>
          <div>Loading the tutorial…</div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="wasm_exec.js"></script>

<!-- Leaflet, for core.MapView.

     The host page's dependency and not the runtime's, deliberately:
     grmob-runtime.js uses window.L when it is here and draws a placeholder box
     when it is not, so an app with no map on any screen pays nothing and an app
     whose content policy forbids third-party script has somewhere to say so.
     See the "Live maps" section of grmob-runtime.js.

     The stylesheet is not optional. Leaflet positions its tiles, its controls
     and its markers from this file, and a map with the script and not the CSS
     renders as a heap of overlapping tile images — which looks like a bug in
     the map rather than a missing link tag.

     Pinned to an exact version, because this is the page a visitor loads: a
     floating "latest" would let somebody else's release change this site.
     There is no integrity hash, and that is worth naming rather than leaving as
     an oversight — a wrong one fails closed and silently (the browser refuses
     the script, window.L never appears, and every map on the site quietly
     becomes a grey box), so it is a thing to add from a verified checksum
     rather than from memory. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Runtime JavaScript -->
<script src="grmob-runtime.js"></script>
<script src="camera.js"></script>

<!-- Init WASM -->
<script>
    // Host wiring: instantiate the module, mount the initial tree, and route
    // DOM events back into Go. See docs/platforms/wasm.md for the contract
    // (GrMobWASM.* on the Go side; GrMobApplyPatches / GrMobSystemEvent on
    // this side, both defined by grmob-runtime.js).
    const bootEl = document.getElementById("boot");
    function fail(msg) {
        bootEl.className = "boot err";
        bootEl.textContent = "The tutorial failed to start.\n\n" + msg;
    }

    // --- Deep links -----------------------------------------------------------
    // The URL's hash names a lesson (#2.3) or a chapter (#3, which the app
    // resolves to that chapter's first lesson). The app knows nothing about URLs;
    // it speaks two generic channels (examples/tutorial/deeplink.go) and this
    // page translates. Inbound, the hash goes to Go as a "route" host event —
    // at boot, once the app is mounted, and again on every hashchange (the
    // back button, a pasted link, an edited address bar). Outbound, every
    // navigation in the app arrives here as a "route" system event and the
    // hash is rewritten with replaceState, which fires no hashchange, so the
    // two directions never echo each other. Navigations are replaced rather
    // than pushed on purpose: the app owns its own back stack (‹ Contents),
    // and doubling it in the browser history would make Back take two
    // presses per lesson.
    const lessonFromHash = () => {
        const m = /^#(\d+(?:\.\d+)?)$/.exec(location.hash);
        return m ? m[1] : "";
    };
    const copy = document.getElementById("copylink");
    // The inbound hop is not echoed by the app (see deeplink.go), so the
    // page updates its own chrome from the hash it is about to send.
    const sendRoute = () => {
        const host = window.GrMobWASM;
        if (!host || typeof host.HostEvent !== "function") return;
        const lesson = lessonFromHash();
        showRoute(lesson);
        host.HostEvent("route", JSON.stringify({ lesson }));
    };
    window.addEventListener("hashchange", sendRoute);

    const showRoute = (lesson) => {
        const url = location.pathname + location.search + (lesson ? "#" + lesson : "");
        // history.state, not null: while a lesson is open the current entry
        // is the runtime's browser-back entry, which it recognises by its
        // state (see the browser-back section of grmob-runtime.js).
        if (location.hash !== (lesson ? "#" + lesson : "")) history.replaceState(history.state, "", url);
        copy.hidden = !lesson;
        copy.textContent = "🔗 Copy link";
        copy.classList.remove("done");
    };
    // Wrap, rather than edit, the runtime's sink: "route" is this page's
    // vocabulary, not the runtime's; everything else flows through as before.
    const runtimeSink = window.GrMobSystemEvent;
    window.GrMobSystemEvent = (name, payloadJSON) => {
        if (name === "route") {
            showRoute(JSON.parse(payloadJSON).lesson || "");
            return;
        }
        runtimeSink(name, payloadJSON);
    };
    copy.addEventListener("click", () => {
        navigator.clipboard.writeText(location.href).then(() => {
            copy.textContent = "✓ Copied";
            copy.classList.add("done");
            setTimeout(() => { copy.textContent = "🔗 Copy link"; copy.classList.remove("done"); }, 1500);
        }).catch(() => { /* clipboard blocked: the address bar still has the link */ });
    });

    // --- Layout -------------------------------------------------------------
    // Two layouts: "split" (the guide on a reading pane, the demos on a phone
    // beside it — the default) and "phone" (the whole tutorial inside one
    // phone, as it runs on a device). The reader's choice is remembered in
    // localStorage; the split also needs room for both panes, so under
    // SPLIT_MIN the phone layout is used whatever the choice, and the switch
    // is hidden rather than offered as a button that would do nothing.
    //
    // Like the deep links, the app knows nothing of windows or storage: this
    // page sends it the mode as a "layout" host event (examples/tutorial/
    // split.go) at boot and on every change, and the app rearranges its tree.
    // The bezel CSS follows the tree by itself (:has(#tutorial-split)), so
    // nothing here touches the stage.
    const LAYOUT_KEY = "grmob-tutorial-layout";
    const SPLIT_MIN = "(min-width: 900px)";
    const wide = window.matchMedia(SPLIT_MIN);
    const toggle = document.getElementById("layout-toggle");
    // Storage can be absent or throw (a private window, blocked site data):
    // the layout then falls back to the default and simply is not remembered.
    const readChoice = () => {
        try { return localStorage.getItem(LAYOUT_KEY) === "phone" ? "phone" : "split"; }
        catch { return "split"; }
    };
    const saveChoice = (mode) => {
        try { localStorage.setItem(LAYOUT_KEY, mode); } catch { /* not remembered */ }
    };
    let choice = readChoice();
    const sendLayout = () => {
        const mode = wide.matches ? choice : "phone";
        toggle.hidden = !wide.matches;
        for (const b of toggle.querySelectorAll("button")) {
            b.setAttribute("aria-pressed", String(b.dataset.mode === choice));
        }
        const host = window.GrMobWASM;
        if (!host || typeof host.HostEvent !== "function") return; // before boot: boot sends it
        host.HostEvent("layout", JSON.stringify({ mode }));
    };
    toggle.addEventListener("click", (ev) => {
        const b = ev.target.closest("button[data-mode]");
        if (!b || b.dataset.mode === choice) return;
        choice = b.dataset.mode;
        saveChoice(choice);
        sendLayout();
    });
    wide.addEventListener("change", sendLayout);
    // Now, for the switch alone: it is page chrome, usable while main.wasm
    // is still downloading, and the app is told once it exists (boot).
    sendLayout();

    // The app's window, for hooks.UseWindow (the runtime's windowMetrics asks
    // this on every report and after every patch). Not the browser's: the
    // demos run on a phone. In the split that is the phone's content area
    // (split.go, phoneScreen); in the phone layout it is #app inside the
    // bezel, which on a real phone's browser is the viewport anyway. So 4.21's
    // size classes describe the phone the reader is looking at.
    window.GrMobViewport = () =>
        document.getElementById("tutorial-phone-content") || document.getElementById("app");

    // --- Boot ---------------------------------------------------------------
    // One function rather than a run-once script, because it runs more than
    // once: the dev server's hot reload (serve -dev) calls GrMobHost.boot again
    // after stopping the previous module, and everything a fresh module needs
    // — a fresh Go instance, the fetch, the mount, the route replay — is the
    // same as at page load. It resolves to a handle on the running instance:
    // `go` is the wasm_exec.js object driving it, `exited` the promise go.run
    // returned, which settles when the module's main returns
    // (GrMobWASM.Shutdown). Nothing in this page reads the handle; it exists
    // for the hot-reload client, which has to know when the old module has
    // actually stopped before it starts the next.
    async function boot() {
        const go = new Go();
        // instantiateStreaming needs the server to send application/wasm; fall
        // back to a buffered instantiate where it does not (a bare file:// open,
        // some ad-hoc servers) rather than showing an error for a MIME type.
        const source = fetch("main.wasm").then(r => {
            if (!r.ok) throw new Error(`main.wasm: HTTP ${r.status} (run ./build.sh first?)`);
            return r;
        });
        const result = await (("instantiateStreaming" in WebAssembly)
            ? WebAssembly.instantiateStreaming(source, go.importObject)
                .catch(() => source.then(r => r.arrayBuffer()).then(b => WebAssembly.instantiate(b, go.importObject)))
            : source.then(r => r.arrayBuffer()).then(b => WebAssembly.instantiate(b, go.importObject)));
        // Not awaited: the promise settles only when main returns, which for
        // a module that is never hot-reloaded is never.
        const exited = go.run(result.instance);
        // Before the first render: the tutorial holds a mode sent now and
        // starts in it (examples/tutorial/split.go, bootLayout), so a wide
        // window's first tree is already the split. It used to be sent after
        // the mount, which built and mounted the phone layout and then patched
        // it into the split within the same task (never painted, but thrown
        // away on every wide boot). wasm/verify's browser check 17 holds this
        // order.
        sendLayout();
        const patch = window.GrMobWASM.RenderInitial();
        GrMob.mount(patch);
        // The app has just mounted on the contents; a hash present at boot
        // pushes the lesson on top of it, exactly as a row tap would.
        if (lessonFromHash()) sendRoute();
        return { go, exited };
    }
    // The handle the hot-reload client picks up: `running` is the handle
    // promise of whichever boot is current. The client replaces it as it swaps
    // modules; this page only ever starts the first.
    window.GrMobHost = { boot, running: null };
    window.GrMobHost.running = boot();
    window.GrMobHost.running.catch(err => {
        console.error(err);
        fail(err && err.message ? err.message : String(err));
    });

    window.GoInvokeCallback = (id, payload) => {
        window.GrMobWASM.ReceiveEvent(id, JSON.stringify(payload));
        const patch = window.GrMobWASM.RenderAgain();
        GrMob.patch(patch);
    };
</script>
</body>
</html>
