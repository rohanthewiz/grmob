# Continuous integration for GrMob.
#
# The repo's release gate has always been a fixed list of checks run by hand
# before a tag (see ai_docs/plans/fable-pre-0.1.0-analysis.md, Phase 7). This
# workflow is that list, unchanged, split across three runners by what each
# check actually needs:
#
#   go       ubuntu   Go toolchain + Node        formatting, vet, tests, WASM
#   ios      macOS    Go + Swift (arm64 host)    ios/verify/run.sh, and the
#                                                remedy drill over its gate
#   android  ubuntu   Go + JDK 17 + SDK/NDK      android/verify, the remedy
#                                                drill over its gradle-cache
#                                                gates, gomobile bind, Gradle,
#                                                android/verify again
#
# The three are independent and run in parallel; a red iOS job does not hide a
# red Go job. The Go job is the fast one and is what a contributor watches.
#
# # The remedy drills, and why they are here and not in a test
#
# Each verify pass decides in shell whether it can run on this machine, and
# prints a skip naming what to do about it. gate_test.sh proves those sentences
# are different sentences chosen in the right order; nothing proved any of them
# was TRUE — and android/verify's two compiler skips once named a gradle task
# that fetches no compiler, so a reader who ran what they said met the same skip
# again.
#
# The only instrument for that is running the remedy on a machine that has the
# fault, which is a machine with an SDK, a network and a cache it has never
# filled. That is this workflow and nowhere else: `go test ./...` has none of
# them. See internal/gateharness/remedy.sh.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

# Least privilege: nothing here writes to the repo, comments on PRs or
# publishes anything.
permissions:
  contents: read

# A second push to the same branch supersedes the first. Tags are excluded
# from cancellation by including the ref in the group: a release build should
# never be cancelled by a subsequent branch push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go, WASM and the JS runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Reads 1.26.1 from the `go` line rather than repeating it here, so
          # the toolchain bump happens in one place. setup-go caches the
          # module and build caches by default.
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          # wasm/verify needs only `node --test`; no npm install, no
          # node_modules, no lockfile. 22 is the current LTS line.
          node-version: '22'

      - name: gofmt
        # `gofmt -l` reports unformatted files on stdout and still exits 0, so
        # the exit status has to be derived from whether it printed anything.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: clean"

      - name: go vet
        run: go vet ./...

      - name: go test -race
        # The race build runs the same tests as a plain `go test ./...` and
        # additionally instruments them, so it is run alone rather than after
        # a duplicate non-race pass. The engine dispatches callbacks and timer
        # pushes from different goroutines, which is exactly what -race is for.
        run: go test -race ./...

      - name: Build the docs server
        # cmd/docs is a module of its own — deliberately, so that gkdocs and
        # its dependencies stay out of the framework's go.mod (see its
        # main.go). The consequence is that neither `go vet ./...` nor
        # `go test -race ./...` above reaches it, so it gets a step. Without
        # one, the only thing standing between a compile error here and a
        # release is somebody happening to run ./docs.sh.
        #
        # gofmt is not repeated: `gofmt -l .` above walks directories, not
        # modules, so these files are already covered by it.
        working-directory: cmd/docs
        run: |
          go vet ./...
          go build -o "$RUNNER_TEMP/docs" .

      - name: Build the WASM target
        # -o is mandatory: the package path ./wasm is also a directory named
        # `wasm`, and without -o the compiler refuses to overwrite a directory
        # with its build output. RUNNER_TEMP keeps the artifact out of the
        # working tree, where wasm/main.wasm is gitignored anyway.
        run: GOOS=js GOARCH=wasm go build -o "$RUNNER_TEMP/main.wasm" ./wasm

      - name: Verify the JS runtime against Go's patch transcripts
        # Go generates transcripts from real example apps, Node replays them
        # through the shipped wasm/grmob-runtime.js against a minimal DOM and
        # compares with Go's final render, then runs the event/focus unit tests.
        run: ./wasm/verify/run.sh

  ios:
    name: iOS runtime conformance
    # The harness compiles for arm64-apple-macos14.0, so it needs an
    # Apple-silicon runner carrying at least the macOS 14 SDK. Every current
    # GitHub macOS image qualifies; `latest` avoids a hardcoded image label
    # going out of support.
    runs-on: macos-latest
    # Twenty for the pass, plus the drill below, which runs it twice more.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify the Swift runtime and type-check the view layer
        # Two checks in one script: the data layer (TreeStore/parser) replays
        # Go's bridge transcript and is compared tree-for-tree, and the SwiftUI
        # view layer is type-checked. The latter matters on its own because
        # Renderer.swift carries a hand-written Layout and a deep opaque-type
        # modifier chain, which fail at compile time in ways no data-layer test
        # would catch. Neither needs a simulator.
        run: ./ios/verify/run.sh

      - name: Drill the app-layer gate's remedy sentence
        # The gate's one remedy is "install Xcode", which is not a command — so
        # the executable form is the other direction: hide the iPhoneOS SDK
        # behind an xcrun shim, require the pass to skip with the sentence that
        # names Xcode, put it back, and require the app layer to type-check.
        #
        # After the pass above rather than before it, so that a genuinely
        # broken runtime is reported as a broken runtime rather than as a drill
        # whose second half did not print an OK.
        #
        # This is the only place it can run: it needs a machine that HAS an
        # Xcode, because the second half of a drill has to be the same machine
        # in the same run as the first.
        run: ./ios/verify/remedy.sh

  android:
    name: Android AAR and Compose renderer
    runs-on: ubuntu-latest
    # Thirty for the build, plus the drill below, which fills a gradle cache of
    # its own from cold before the job fills the real one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v4
        with:
          # AGP 9 and the Kotlin 2.x compiler run on 17; the module also
          # compiles its Java/Kotlin to 17 bytecode (app/build.gradle).
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install the compile SDK
        # compileSdk/targetSdk are 34. The hosted image ships several
        # platforms, but which ones is not contractual, and AGP does not
        # auto-download missing components. This is a no-op when present.
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Drill the gradle-cache gates' remedy sentences
        # Before the cache is populated, and with a GRADLE_USER_HOME of its own
        # so it stays that way for the step below.
        #
        # The fault this drills IS a cache that has never been filled, which is
        # the state the next step exists to leave. Run afterwards it would have
        # to unfill one; run here it only has to not disturb the real one, and
        # a scratch home is the whole of that. The two sentences it drills are
        # the two the step below runs commands for, which is not a coincidence:
        # those commands are what the sentences tell a reader to run, and this
        # is what says they work.
        #
        # It needs the SDK installed above and a network, and it takes both
        # from the runner. See android/verify/remedy.sh.
        run: ./android/verify/remedy.sh

      # Everything android/verify needs, and the two network calls it will not
      # make itself.
      #
      # The passes below run `--offline` on purpose: a verify script that
      # reached the network would stop being runnable in the position the
      # Android build already occupies. That stance is what makes a cold cache
      # — which is every first CI run — skip every Kotlin check with a sentence
      # nobody reads. So the fetching is a step of its own, named as such, and
      # the scripts keep their offline promise.
      #
      # Three commands, and between them the whole of it. Measured from an empty
      # GRADLE_USER_HOME on a developer machine:
      #
      #   printVerifyClasspath      the app's compile classpath + AGP's
      #                             platform jars, which sources.sh type-checks
      #                             against. ~20s cold.
      #   fetchKotlinCompiler       the command-line compiler and the Compose
      #                             compiler plugin, at the build's own Kotlin
      #                             version. Nothing else pulls these: they are
      #                             not on anybody's compile classpath.
      #   fetchComposeLayoutSources foundation-layout's sources jar, which
      #                             mobile/verify reads androidx's own
      #                             arithmetic out of. Without it that check
      #                             skips, and it is the one most likely to
      #                             catch an androidx release changing under us.
      #
      # None of it needs the NDK, gomobile or libs/grmob.aar, which is the whole
      # reason the step can sit here rather than after the bind below.
      - name: Populate the gradle cache android/verify reads
        working-directory: android
        run: |
          ./gradlew --no-daemon -q :app:printVerifyClasspath > /dev/null
          ./gradlew --no-daemon -q :app:fetchKotlinCompiler
          ./gradlew --no-daemon -q :app:fetchComposeLayoutSources

      # Does the Kotlin that imports Compose and the Android SDK compile?
      #
      # Before the bind below, deliberately. com.grmob.runtime imports nothing
      # from the .aar, so this stage needs no NDK and no gomobile — and a broken
      # renderer, style solver or editor is the commonest way this job goes red.
      # Placed here it is reported in seconds; placed after the bind it would be
      # reported two and a half minutes later, having built a binding nobody was
      # going to use.
      #
      # It runs the runtime stage only and says so: the app stage needs the
      # .aar and is picked up by the full pass at the end of this job.
      - name: Compile the Compose runtime (no NDK, no gomobile)
        run: ./android/verify/sources.sh

      - name: Build the AAR with the pinned gomobile
        # go.mod pins gomobile/gobind in a `tool` block, but `go tool gomobile`
        # alone is not enough: gomobile shells out to a *gobind executable* and
        # fails with "gobind was not found, please run gomobile init" when one
        # is not on PATH. Building the pinned gobind into a temp dir and
        # prepending it satisfies that without a `go install ...@latest`, which
        # would silently ignore the pin and fetch a different version.
        #
        # android/build.sh is deliberately not used here: it resolves gomobile
        # from GOPATH/bin and defaults ANDROID_HOME to a macOS path.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/gobind" golang.org/x/mobile/cmd/gobind
          export PATH="$RUNNER_TEMP/bin:$PATH"
          # ANDROID_NDK_LATEST_HOME is set by the hosted image; the fallback
          # picks the highest installed NDK the way build.sh does.
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}"
          mkdir -p android/app/libs
          go tool gomobile bind -target=android -androidapi 24 \
            -o android/app/libs/grmob.aar \
            ./mobile ./examples/mobileapp

      - name: Assemble the debug APK
        # Compiles the Compose renderer against the freshly bound AAR, and is
        # the only thing here that builds the app the way a developer does —
        # resources, manifest, dexing and all.
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # The rest of android/verify, which needs the .aar the bind produced.
      #
      # Three things, none of which assembleDebug above can say:
      #
      #   the gate tests      every arm of both gates, as a function of values —
      #                       the arms nobody can reach by owning a machine
      #   the Compose census  androidx's own arithmetic, read out of the sources
      #                       jar the fetch step put in the cache
      #   the JVM harness     GrMobSelectMenu.kt and GrMobProgress.kt EXECUTED
      #                       against Go's case tables and compared. A compile
      #                       proves a file parses; this proves it computes the
      #                       same answers as the Go it mirrors.
      #
      # It re-runs sources.sh as its first act, and this time both stages: the
      # .aar exists now, so com.grmob.app is type-checked as well. That is the
      # one part of the Kotlin compile the early step above could not do.
      - name: Run android/verify against the built AAR
        run: ./android/verify/run.sh
